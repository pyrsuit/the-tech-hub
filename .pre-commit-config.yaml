# Install the git hook once with:  uv run pre-commit install
# Run on all files manually with:  uv run pre-commit run --all-files
# Update hook versions with:       uv run pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Keep Markdown hard line breaks (two trailing spaces)
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        exclude: ^docs/CNAME$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Keep uv.lock in sync with pyproject.toml (CI runs `uv sync --locked`)
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.9
    hooks:
      - id: uv-lock
